name: Windows desktop
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'web/**', 'worker/**', 'scripts/**', 'package*.json', 'README.md', 'docs/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run desktop:pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Point-Break-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
